version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: durkalive-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: durkalive
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - durkalive-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - durkalive-network

volumes:
  durkalive-pgdata:
    name: durkalive-pgdata

networks:
  durkalive-network:
    name: durkalive-network
    driver: bridge
